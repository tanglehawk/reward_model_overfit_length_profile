[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tanglehawk-reward_model_overfit_length_profile"
version = "0.1.0"
description = "按段落统计数据平台工程师·奖励模型的过拟合相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tanglehawk" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tanglehawk.github.io"
Repository = "https://github.com/tanglehawk/reward_model_overfit_length_profile"
Issues = "https://github.com/tanglehawk/reward_model_overfit_length_profile/issues"

[project.scripts]
reward_model_overfit_length_profile = "reward_model_overfit_length_profile:main"

[tool.setuptools]
py-modules = ["reward_model_overfit_length_profile"]
